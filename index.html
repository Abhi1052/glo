<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1026">
  <meta name="description" content="Glo — science-backed bedtime stories for every age, told by Glo the firefly.">
  <title>Glo — Bedtime stories</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.webp" type="image/webp">
  <link rel="apple-touch-icon" href="apple-touch-icon.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" class="tabbar" hidden></nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="nightlight" hidden>
    <div class="nl-dot" aria-hidden="true"></div>
    <p class="nl-text">Goodnight...</p>
    <button class="nl-exit" type="button">Go back</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
